<VirtualHost *:80>
    ServerName your-domain.com
    ServerAlias www.your-domain.com
    ServerAdmin admin@your-domain.com

    # Redirect HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName your-domain.com
    ServerAlias www.your-domain.com
    ServerAdmin admin@your-domain.com

    # SSL Configuration (Let's Encrypt)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/your-domain.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/your-domain.com/privkey.pem

    # SSL Security
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite HIGH:!aNULL:!MD5
    SSLHonorCipherOrder on
    SSLSession Cache shmcb:/var/cache/mod_ssl/scache(512000)
    SSLSessionCacheTimeout 300

    # Security Headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

    # Root Directory
    DocumentRoot /var/www/greenroots/

    # Enable mod_rewrite
    RewriteEngine On

    # Enable gzip compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/plain
        AddOutputFilterByType DEFLATE text/html
        AddOutputFilterByType DEFLATE text/xml
        AddOutputFilterByType DEFLATE text/css
        AddOutputFilterByType DEFLATE text/javascript
        AddOutputFilterByType DEFLATE application/xml
        AddOutputFilterByType DEFLATE application/xhtml+xml
        AddOutputFilterByType DEFLATE application/rss+xml
        AddOutputFilterByType DEFLATE application/javascript
        AddOutputFilterByType DEFLATE application/x-javascript
        AddOutputFilterByType DEFLATE application/json
    </IfModule>

    # Service Worker Cache Control
    <Files "service-worker.js">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
        Header set Pragma "no-cache"
        Header set Expires "0"
        Header set Service-Worker-Allowed "/"
        AddType application/javascript .js
    </Files>

    # Manifest Cache Control
    <Files "manifest.json">
        Header set Cache-Control "no-cache, must-revalidate"
        AddType application/manifest+json .json
    </Files>

    # HTML Files Cache Control
    <FilesMatch "\.html?$">
        Header set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>

    # Static Assets Cache (1 year)
    <FilesMatch "\.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
    </FilesMatch>

    # API Proxy to Backend
    <Location /api/>
        ProxyPreserveHost On
        ProxyPass https://greenroots-backend.onrender.com/api/
        ProxyPassReverse https://greenroots-backend.onrender.com/api/
        ProxyTimeout 60
    </Location>

    # SPA Routing - Serve index.html for non-matching routes
    <Directory /var/www/greenroots/>
        Options FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # Deny access to hidden files
    <FilesMatch "^\.|\.php$">
        Deny from all
    </FilesMatch>

    # Logging
    CustomLog ${APACHE_LOG_DIR}/greenroots-access.log combined
    ErrorLog ${APACHE_LOG_DIR}/greenroots-error.log

    # Enable required modules
    # a2enmod rewrite
    # a2enmod proxy
    # a2enmod proxy_http
    # a2enmod deflate
    # a2enmod headers
    # a2enmod ssl
</VirtualHost>

# HSTS Preload (optional - only after testing HTTPS thoroughly)
# Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
